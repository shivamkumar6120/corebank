spring.application.name=corebank
server.port=8088
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/corebank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:corebank}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

app.jwt.secret=CoreBankAcademicProjectSecretKeyMustBeLongEnoughForHS256TokenSigning2026
app.jwt.expiration-ms=86400000
app.otp.expiry-minutes=5
app.otp.demo-mode=true

logging.level.com.corebank=INFO
logging.level.org.springframework.security=WARN
