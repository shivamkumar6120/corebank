services:
  db:
    image: mysql:8.4
    container_name: corebank-db
    environment:
      MYSQL_ROOT_PASSWORD: corebank
      MYSQL_DATABASE: corebank
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcorebank"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - corebank-mysql:/var/lib/mysql

volumes:
  corebank-mysql:
